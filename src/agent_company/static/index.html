<body>
<div id="auth" class="auth" hidden></div>
<div id="app" class="shell" hidden>
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main class="main">
    <header class="topbar">
      <h1 id="view-title">Dashboard</h1>
      <div class="topbar-right">
        <span id="whoami" class="muted"></span>
        <span id="stop-level" class="pill failed" hidden></span>
        <span id="top-views" class="top-views"></span>
        <button class="icon-btn estop" id="estop" hidden title="Emergency stop: stop all autonomous work now" aria-label="Emergency stop"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2zM12 10v4M12 17h.01"/></svg></button>
        <button class="icon-btn" id="my-git" title="My Git settings: name, email, branch and GitHub access" aria-label="My Git settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3v12M18 9a3 3 0 1 0 0-.01M6 21a3 3 0 1 0 0-.01M18 12c0 4-6 3-12 6"/></svg></button>
        <button class="icon-btn" id="layout" title="Screen format" aria-label="Screen format"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 4h18v16H3zM9 4v16M15 4v16"/></svg></button>
        <button class="icon-btn" id="theme" title="Light / dark" aria-label="Toggle theme"></button>
      </div>
      <div id="loadbar" class="loadbar" role="progressbar" aria-label="Loading" hidden></div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>
<div id="modal" class="modal" hidden><div class="modal-card" role="dialog" aria-modal="true"><button class="icon-btn modal-close" id="modal-close" aria-label="Close">✕</button><div id="modal-body"></div></div></div>
